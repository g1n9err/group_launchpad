openapi: 3.0.3
info:
  title: Group Launchpad API
  version: 0.1.0
  description: >
    Automation platform for launching student groups across Slack, Google
    Classroom, Google Drive, and Google Forms. This contract is the single
    source of truth for both sides: the Go server (oapi-codegen) and the web
    dashboard (openapi-typescript) generate their types from this file via
    `make gen`.
servers:
  - url: http://localhost:8080
    description: local development
tags:
  - name: system
  - name: auth
  - name: admin
  - name: groups
  - name: integrations
paths:
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange email and password for a bearer session token
      description: >
        Multi-role authentication (PRD §7.4). The response token travels in
        the Authorization: Bearer header only — never in URLs — and expires.
        Only the SHA-256 hash of the token is stored server-side. Failed
        logins are indistinguishable (no user enumeration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/resume:
    post:
      tags: [auth]
      operationId: resumeSession
      summary: Restore a sign-in across page refreshes (HttpOnly session cookie)
      description: >
        The browser holds an HttpOnly, Path=/api/auth, SameSite=Strict cookie
        set at login. This endpoint rotates that cookie atomically (one-time
        use — replay fails) and returns a fresh bearer session. No
        Authorization header, no JS-readable storage, no token in URLs.
      responses:
        "200":
          description: a new session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: no cookie, or the cookie is expired/revoked (it is cleared)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security:
        - BearerAuth: []
      summary: Revoke the presented bearer session
      responses:
        "200":
          description: session revoked
        "401":
          description: no valid bearer token was presented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/me:
    get:
      tags: [auth]
      operationId: getAuthMe
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Return the authenticated identity and role
      responses:
        "200":
          description: the caller's identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      security:
        - BearerAuth: []
      summary: Rotate the bearer token (token refresh, PRD §7.4)
      description: >
        Revokes the presented session and issues a fresh one. Revoked or
        expired tokens cannot be refreshed — clients must log in again.
      responses:
        "200":
          description: a new session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: the presented token is missing, expired, or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users:
    get:
      tags: [admin]
      operationId: listAdminUsers
      security:
        - BearerAuth: []
      summary: List user accounts (admin only, PRD §3.2)
      responses:
        "200":
          description: user accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [admin]
      operationId: createAdminUser
      security:
        - BearerAuth: []
      summary: Create a user account with a role and initial password (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: a user with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{userId}/password:
    put:
      tags: [admin]
      operationId: resetAdminUserPassword
      security:
        - BearerAuth: []
      summary: Reset a user's password (admin only)
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetInput"
      responses:
        "200":
          description: password replaced
        "401":
          description: credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: unknown user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/users/{userId}:
    delete:
      tags: [admin]
      operationId: deleteAdminUser
      security:
        - BearerAuth: []
      summary: Delete a user account (admin only; own account excluded)
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: deleted
        "400":
          description: admins cannot delete their own account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: unknown user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/staff:
    get:
      tags: [admin]
      operationId: listPredefinedStaff
      security:
        - BearerAuth: []
      summary: List the predefined staff members (admin only, PRD §3.2, §4.2)
      responses:
        "200":
          description: predefined staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PredefinedStaff"
        "401":
          description: credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [admin]
      operationId: createPredefinedStaff
      security:
        - BearerAuth: []
      summary: Add a predefined staff member (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredefinedStaffInput"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredefinedStaff"
        "401":
          description: credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: the staff member already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/admin/staff/{staffId}:
    delete:
      tags: [admin]
      operationId: deletePredefinedStaff
      security:
        - BearerAuth: []
      summary: Remove a predefined staff member (admin only)
      parameters:
        - name: staffId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: deleted
        "401":
          description: credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: administrator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: unknown predefined staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [system]
      operationId: getReadiness
      summary: Readiness probe — verifies PostgreSQL connectivity
      responses:
        "200":
          description: ready to serve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: dependency unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/groups:
    get:
      tags: [groups]
      operationId: listGroups
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: List groups (newest first)
      description: >
        Role-scoped listing: coordinators and administrators see every group;
        lecturers and teaching assistants see only the groups they participate
        in; students are not authorized (the PRD gives students no API access).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: a page of groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupsPage"
        "401":
          description: credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the authenticated role may not list groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [groups]
      operationId: createGroup
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Create a group (starts in draft; launch is a separate operation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreate"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          description: coordinator or admin credentials are required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the authenticated role may not create groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: a group with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/groups/{groupId}:
    get:
      tags: [groups]
      operationId: getGroup
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Get one group (group-scoped)
      description: >
        Coordinators and administrators may read any group. Lecturers and
        teaching assistants may read only groups they participate in.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          description: credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the caller is not a member of this group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: unknown group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/groups/{groupId}/resources:
    get:
      tags: [groups]
      operationId: getGroupResources
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: List the group's external resources (group-scoped)
      description: >
        Active Slack channels, the Classroom course, Drive folders, and the
        intake form URL of one group. Coordinators/administrators see any
        group; lecturers/TAs only their assigned groups (PRD §3.3, §3.4).
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: the group's external resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupResource"
        "401":
          description: credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: the caller is not a member of this group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: unknown group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/groups/{groupId}/launch:
    post:
      tags: [groups]
      operationId: launchGroup
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Queue a unified multi-platform group launch
      description: >
        Enqueues the launch pipeline: Slack channels, Classroom course +
        enrollment + teacher assignment, Drive folders + permissions,
        Forms intake. Each step is idempotent. Poll GET /status for the
        per-platform results.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "401":
          description: Coordinator credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The request origin is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "202":
          description: Launch queued successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchQueued"
        "404":
          description: Unknown group
        "422":
          description: The group name cannot be used for Slack channels
        "503":
          description: Group launch is unavailable
  /api/groups/{groupId}/status:
    get:
      tags: [groups]
      operationId: getGroupLaunchStatus
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Read the unified multi-platform launch result
      description: >
        Returns the latest launch outcome across all platforms (Slack,
        Classroom, Drive, Forms). Falls back to Slack-only status when no
        unified result exists.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "401":
          description: Coordinator credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Unified launch result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupLaunchResult"
        "404":
          description: No launch has been recorded for this group
        "503":
          description: Launch status is unavailable
  /api/groups/{groupId}/classroom/provision:
    post:
      tags: [groups]
      operationId: provisionGroupClassroom
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Create or reuse the Google Classroom course for a group
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "401":
          description: Coordinator credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The request origin is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Linked Google Classroom course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomCourse"
        "404":
          description: Unknown group
        "502":
          description: Google Classroom rejected the request
        "503":
          description: Google OAuth is unavailable
  /api/groups/{groupId}/drive/provision:
    post:
      tags: [groups]
      operationId: provisionGroupDrive
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Create or reuse the group's Google Drive folder tree
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Linked Google Drive folders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveFolders"
        "401":
          description: Coordinator credentials are missing or invalid
        "403":
          description: The request origin is not allowed
        "404":
          description: Unknown group
        "502":
          description: Google Drive provisioning failed and can be retried
        "503":
          description: Coordinator access or Google OAuth is unavailable
  /api/groups/{groupId}/forms:
    get:
      tags: [groups]
      operationId: getGroupIntakeForm
      summary: Read a group's saved intake form and questions
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Intake form state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeFormState"
        "401":
          description: Coordinator credentials required
        "404":
          description: No intake form saved for this group
        "503":
          description: Form access is unavailable
  /api/groups/{groupId}/forms/provision:
    post:
      tags: [groups]
      operationId: provisionGroupForm
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Create or reuse an unpublished student intake form
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeFormRequest"
      responses:
        "200":
          description: Linked Google Forms draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeFormDraft"
        "401":
          description: Coordinator credentials are missing or invalid
        "403":
          description: The request origin is not allowed
        "404":
          description: Unknown group
        "409":
          description: The questions differ from the saved form or creation is pending
        "422":
          description: Invalid questions
        "502":
          description: The Google Forms request failed
        "503":
          description: Coordinator access or Google OAuth is unavailable
  /api/groups/{groupId}/forms/publish:
    post:
      tags: [groups]
      operationId: publishGroupForm
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Publish a completed intake draft and return its responder link
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Published intake form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedIntakeForm"
        "401":
          description: Coordinator credentials are missing or invalid
        "403":
          description: The request origin is not allowed
        "404":
          description: The group has no intake form
        "409":
          description: The intake form is not ready to publish
        "502":
          description: Google Forms publication failed
        "503":
          description: Coordinator access or Google OAuth is unavailable
  /api/groups/{groupId}/forms/distribute:
    post:
      tags: [groups]
      operationId: distributeGroupForm
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Queue the published intake link for the group's saved students
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "202":
          description: Current delivery records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeDeliveries"
        "401":
          description: Coordinator credentials are missing or invalid
        "403":
          description: The request origin is not allowed
        "404":
          description: The group has no intake form
        "409":
          description: The intake form is not published
        "503":
          description: Coordinator access or SMTP delivery is unavailable
  /api/groups/{groupId}/forms/deliveries:
    get:
      tags: [groups]
      operationId: getGroupFormDeliveries
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Read recipient-level intake delivery results
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Current delivery records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeDeliveries"
        "401":
          description: Coordinator credentials are missing or invalid
        "404":
          description: The group has no intake form
        "503":
          description: Coordinator access or delivery status is unavailable
  /api/groups/{groupId}/forms/responses/import:
    post:
      tags: [groups]
      operationId: importGroupFormResponses
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Import verified intake responses for the group's students
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeResponseSummary"
        "401":
          description: Coordinator credentials are missing or invalid
        "403":
          description: The request origin is not allowed
        "404":
          description: The group has no intake form
        "409":
          description: The form is not published with verified email collection
        "502":
          description: Google Forms response import failed
        "503":
          description: Coordinator access or Google OAuth is unavailable
  /api/groups/{groupId}/announcements:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [groups]
      operationId: listGroupAnnouncements
      summary: List up to 100 scheduled Slack announcements and their results
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      responses:
        "200":
          description: The group's announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledAnnouncement"
        "401":
          description: Coordinator credentials required
        "404":
          description: Unknown group
        "503":
          description: Announcement access is unavailable
    post:
      tags: [groups]
      operationId: scheduleGroupAnnouncement
      summary: Schedule a Slack announcement in a channel linked to the group
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementSchedule"
      responses:
        "202":
          description: New or existing scheduled announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledAnnouncement"
        "401":
          description: Coordinator credentials required
        "403":
          description: The request origin is not allowed
        "404":
          description: Unknown group
        "409":
          description: Request ID conflict or channel unavailable for this group
        "422":
          description: Invalid announcement
        "503":
          description: Slack or announcement access is unavailable
  /api/audit-notifications:
    get:
      tags: [groups]
      operationId: getAuditNotifications
      summary: List current issues and recent audit changes for the coordinator
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      responses:
        "200":
          description: Current issues and recent notifications, up to 50 of each
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditNotifications"
        "401":
          description: Coordinator credentials required
        "503":
          description: Audit notifications are unavailable
  /api/groups/{groupId}/audits:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags: [groups]
      operationId: listGroupAudits
      summary: List the most recent group resource audits
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      responses:
        "200":
          description: Up to 20 snapshots, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupAudit"
        "401":
          description: Coordinator credentials required
        "404":
          description: Unknown group
        "503":
          description: Audit access is unavailable
    post:
      tags: [groups]
      operationId: queueGroupAudit
      summary: Queue a read-only audit of a group's external resources
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      responses:
        "202":
          description: Audit job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupAuditQueued"
        "401":
          description: Coordinator credentials required
        "403":
          description: The request origin is not allowed
        "404":
          description: Unknown group
        "503":
          description: Audit access is unavailable
  /api/groups/{groupId}/onboarding:
    get:
      tags: [groups]
      operationId: getGroupOnboarding
      summary: Onboarding visibility for one group (joined Slack tracking, PRD 4.6)
      description: >
        Read-only. "Joined" counts joined_slack and complete. A form submission
        by itself does not count as a Slack join. joinedAt is not tracked yet
        and is deliberately omitted rather than fabricated. Exposes student
        emails — requires coordinator authentication (HTTP Basic). Anonymous
        requests receive 401.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: onboarding report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupOnboarding"
        "404":
          description: unknown group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: List coordinator notifications (PRD §4.9)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "401":
          description: Coordinator credentials required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: notification list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
  /api/notifications/{notificationId}/read:
    post:
      tags: [notifications]
      operationId: markNotificationRead
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Mark a single notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "401":
          description: Coordinator credentials required
        "200":
          description: marked read
        "404":
          description: notification not found
  /api/notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Mark all notifications as read
      responses:
        "401":
          description: Coordinator credentials required
        "200":
          description: all marked read
  /api/announcement-templates:
    get:
      tags: [announcements]
      operationId: listAnnouncementTemplates
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: List announcement templates (PRD §4.8)
      responses:
        "401":
          description: Coordinator credentials required
        "200":
          description: template list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnnouncementTemplate"
    post:
      tags: [announcements]
      operationId: createAnnouncementTemplate
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Create an announcement template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementTemplateInput"
      responses:
        "401":
          description: Coordinator credentials required
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementTemplate"
        "422":
          description: validation error
  /api/announcement-templates/{templateId}:
    get:
      tags: [announcements]
      operationId: getAnnouncementTemplate
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Get one template
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "401":
          description: Coordinator credentials required
        "200":
          description: template
        "404":
          description: not found
    put:
      tags: [announcements]
      operationId: updateAnnouncementTemplate
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Update a template
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementTemplateInput"
      responses:
        "401":
          description: Coordinator credentials required
        "200":
          description: updated
        "404":
          description: not found
    delete:
      tags: [announcements]
      operationId: deleteAnnouncementTemplate
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Delete a template
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "401":
          description: Coordinator credentials required
        "204":
          description: deleted
        "404":
          description: not found
  /api/integrations/google/connect:
    get:
      tags: [integrations]
      operationId: googleConnect
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Start the Google OAuth flow (redirects the browser to Google consent)
      responses:
        "401":
          description: Coordinator credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "302":
          description: redirect to the Google consent screen
        "503":
          description: Google OAuth is not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/integrations/google/callback:
    get:
      tags: [integrations]
      operationId: googleCallback
      summary: Google OAuth callback (Google redirects the browser here after consent)
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: authorization code (absent when the user denied consent)
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: provider error code (e.g. access_denied) when consent failed
      responses:
        "200":
          description: connected (JSON shown to the browser)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleStatus"
        "422":
          description: consent denied, or state invalid/expired/reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: token exchange with Google failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/integrations/google/status:
    get:
      tags: [integrations]
      operationId: googleStatus
      summary: Google connection status (never includes tokens)
      responses:
        "200":
          description: current connection state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleStatus"
        "503":
          description: Google OAuth is not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/integrations/slack/status:
    get:
      tags: [integrations]
      operationId: slackStatus
      summary: Slack connection status (verifies the bot token, never exposes it)
      responses:
        "200":
          description: current connection state after a live auth.test check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlackStatus"
        "503":
          description: Slack is not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/integrations/slack/events:
    post:
      tags: [integrations]
      operationId: slackEvents
      summary: Slack Events API webhook (strictly signature-verified, public)
      description: >
        Verifies Slack's v0 HMAC signature and timestamp BEFORE any parsing,
        handles the url_verification handshake, deduplicates by event_id, and
        processes member_joined_channel events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Slack Events API envelope (verified over raw bytes)
      responses:
        "200":
          description: acknowledged (challenge, duplicate, or processing outcome)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlackEventAck"
        "400":
          description: malformed payload after verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: missing, malformed, or invalid signature / stale timestamp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Slack events are not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/groups/{groupId}/slack/provision:
    post:
      tags: [integrations]
      operationId: provisionGroupSlack
      security:
        - BearerAuth: []
        - CoordinatorBasic: []
      summary: Idempotently provision the group's Slack channels, invitations, and welcome messages
      description: >
        Safe to retry — existing channels are reused, welcome messages are
        posted once, and invitations treat already-in-channel as success.
        Per-item failures are reported, never dropped.
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlackProvisionRequest"
      responses:
        "401":
          description: Coordinator credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The request origin is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: provisioning outcome (per-item statuses)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlackProvisionResult"
        "404":
          description: unknown group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Slack is not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    CoordinatorBasic:
      type: http
      scheme: basic
      description: Legacy shared coordinator account (username "coordinator" + COORDINATOR_PASSWORD). Preserved for compatibility; maps to the coordinator role.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Session token issued by POST /api/auth/login (multi-role). Sent as
        "Authorization: Bearer <token>" — never in URLs. Stored server-side
        as a SHA-256 hash; expires and can be revoked or refreshed.

  parameters:
    Limit:
      name: limit
      in: query
      description: page size
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      description: page offset
      schema:
        type: integer
        minimum: 0
        default: 0
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    UserRole:
      type: string
      description: PRD §3 role model. Students authenticate but have no API access.
      enum: [admin, coordinator, lecturer, ta, student]
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 256
    AuthUser:
      type: object
      required: [role]
      properties:
        userId:
          type: string
          format: uuid
          description: absent for the shared Basic coordinator account
        email:
          type: string
          format: email
          description: the account email; absent for the shared Basic coordinator identity
        role:
          $ref: "#/components/schemas/UserRole"
        viaBasic:
          type: boolean
          description: true when authenticated through the legacy coordinator Basic flow
    AuthSession:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: bearer token — shown exactly once; never persisted in plaintext
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/AuthUser"
    AdminUser:
      type: object
      required: [userId, email, fullName, role, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        createdAt:
          type: string
          format: date-time
    AdminUserInput:
      type: object
      required: [email, fullName, role, password]
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: "#/components/schemas/UserRole"
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: bcrypt's hard input limit is 72 bytes
    PasswordResetInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: bcrypt's hard input limit is 72 bytes
    PredefinedStaff:
      type: object
      required: [staffId, email, fullName, createdAt]
      properties:
        staffId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        createdAt:
          type: string
          format: date-time
    PredefinedStaffInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
          maxLength: 200
          default: ""
    GroupResource:
      type: object
      required: [provider, kind, name, ref, status]
      properties:
        provider:
          type: string
          enum: [slack, google_classroom, google_drive, google_forms]
        kind:
          type: string
          enum: [channel, course, folder, form]
        name:
          type: string
        ref:
          type: string
          description: external resource ID (or responder URL for forms)
        status:
          type: string
          enum: [pending, active, error, deleted]
    IntakeFormQuestion:
      type: object
      required: [title, type, required]
      properties:
        title:
          type: string
        type:
          type: string
          enum: [text, paragraph, single_choice]
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
    IntakeFormRequest:
      type: object
      properties:
        questions:
          description: Ordered draft questions. If omitted, defaults to full name and email.
          type: array
          items:
            $ref: "#/components/schemas/IntakeFormQuestion"
    IntakeFormState:
      type: object
      required: [questions, status, verifiedEmail]
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/IntakeFormQuestion"
        editUrl:
          type: string
        responderUrl:
          type: string
        status:
          type: string
        verifiedEmail:
          type: boolean
    IntakeFormDraft:
      type: object
      required: [formId, editUrl]
      properties:
        formId:
          type: string
        editUrl:
          type: string
    IntakeDeliveries:
      type: object
      required: [deliveries]
      properties:
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/IntakeDelivery"
    IntakeDelivery:
      type: object
      required: [id, recipient, status, attempts]
      properties:
        id:
          type: string
          format: uuid
        recipient:
          type: string
        status:
          type: string
          enum: [pending, sending, sent, failed, unknown]
        attempts:
          type: integer
        error:
          type: string
    AnnouncementSchedule:
      type: object
      required: [requestId, channelName, type, scheduledAt]
      properties:
        requestId:
          type: string
          format: uuid
          description: Reuse the same request ID when retrying the same announcement.
        channelName:
          type: string
        type:
          type: string
          enum: [welcome, staff_intro, rules, reminder, general]
        templateId:
          type: string
          format: uuid
          description: >
            Optional template reference (PRD §4.8). When provided, the
            template's body is used as the announcement message, overriding
            any inline message content.
        message:
          type: string
        scheduledAt:
          type: string
          format: date-time
    ScheduledAnnouncement:
      type: object
      required: [id, groupId, schedule, status]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        schedule:
          $ref: "#/components/schemas/AnnouncementSchedule"
        status:
          type: string
          enum: [scheduled, publishing, published, failed, cancelled, unknown]
        publishedAt:
          type: string
          format: date-time
        slackMessageId:
          type: string
        error:
          type: string
    AuditNotifications:
      type: object
      required: [openIssues, notifications]
      properties:
        openIssues:
          type: array
          items:
            $ref: "#/components/schemas/OpenAuditIssues"
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/AuditNotification"
    OpenAuditIssues:
      type: object
      required: [groupId, groupName, checkedAt, issues]
      properties:
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
        checkedAt:
          type: string
          format: date-time
        issues:
          type: array
          items:
            $ref: "#/components/schemas/GroupAuditResource"
    AuditNotification:
      type: object
      required: [id, groupId, groupName, checkedAt, changes, emailStatus]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
        checkedAt:
          type: string
          format: date-time
        emailStatus:
          type: string
          enum: [disabled, pending, sending, sent, failed, unknown]
        emailError:
          type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/AuditChange"
    AuditChange:
      type: object
      required: [provider, kind, key, before, after]
      properties:
        provider:
          type: string
        kind:
          type: string
        key:
          type: string
        before:
          type: string
        after:
          type: string
    GroupAuditQueued:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: integer
          format: int64
    GroupAudit:
      type: object
      required: [id, groupId, type, checkedAt, results, issues]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        type:
          type: string
          enum: [manual, daily_sync]
        checkedAt:
          type: string
          format: date-time
        results:
          type: array
          items:
            $ref: "#/components/schemas/GroupAuditResource"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/GroupAuditResource"
    GroupAuditResource:
      type: object
      required: [provider, kind, key, status]
      properties:
        provider:
          type: string
        kind:
          type: string
        key:
          type: string
        status:
          type: string
          enum: [ok, unlinked, missing_or_inaccessible, unavailable, archived, inactive, trashed, misconfigured]
    IntakeResponseSummary:
      type: object
      required: [saved, unchanged, ignored]
      properties:
        saved:
          type: integer
        unchanged:
          type: integer
        ignored:
          type: integer
    PublishedIntakeForm:
      type: object
      required: [formId, responderUrl]
      properties:
        formId:
          type: string
        responderUrl:
          type: string
    DriveFolder:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    DriveFolders:
      type: object
      required: [root, subfolders]
      properties:
        root:
          $ref: "#/components/schemas/DriveFolder"
        subfolders:
          type: array
          items:
            $ref: "#/components/schemas/DriveFolder"
    ClassroomCourse:
      type: object
      required: [courseId]
      properties:
        courseId:
          type: string
        studentEnrollments:
          type: array
          items:
            $ref: "#/components/schemas/ClassroomEnrollment"
          description: per-student enrollment outcomes (PRD 4.3)
        teacherAssignments:
          type: array
          items:
            $ref: "#/components/schemas/ClassroomEnrollment"
          description: per-teacher assignment outcomes
    ClassroomEnrollment:
      type: object
      required: [email, success]
      properties:
        email:
          type: string
        success:
          type: boolean
          description: true if enrolled/assigned, false on failure
    GroupLaunchResult:
      type: object
      required: [groupId, status]
      properties:
        groupId:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, completed, partially_failed, failed]
        steps:
          type: array
          items:
            $ref: "#/components/schemas/LaunchStep"
    LaunchQueued:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [queued]
        message:
          type: string
          description: human-readable confirmation
    LaunchStep:
      type: object
      required: [platform, status]
      properties:
        platform:
          type: string
          enum: [slack, classroom, drive, forms, roster]
        status:
          type: string
          enum: [succeeded, partially_failed, failed, skipped]
        detail:
          type: string
          description: human-readable outcome or error summary
    SlackLaunch:
      type: object
      required: [id, groupId, status, attempts, createdAt]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, succeeded, failed, partially_failed]
        attempts:
          type: integer
          minimum: 0
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    Date:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
      x-go-type: string
      description: ISO 8601 calendar date (YYYY-MM-DD)
    GroupStatus:
      type: string
      description: group lifecycle state
      enum: [draft, launching, launched, partially_failed, failed, archived]
    Group:
      type: object
      required: [id, name, courseName, startDate, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        courseName:
          type: string
        startDate:
          $ref: "#/components/schemas/Date"
        status:
          $ref: "#/components/schemas/GroupStatus"
        createdAt:
          type: string
          format: date-time
    GroupCreate:
      type: object
      required: [name, courseName, startDate, staffEmails, lecturerEmails]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        courseName:
          type: string
          minLength: 1
          maxLength: 200
        startDate:
          $ref: "#/components/schemas/Date"
        studentEmails:
          type: array
          maxItems: 500
          items:
            type: string
            format: email
          description: >
            Optional student roster (PRD 4.1). Emails are normalized
            (trimmed, lowercased); invalid entries and post-normalization
            duplicates are rejected with the offending values — never
            silently discarded. Existing users are reused by normalized
            email; new 'student' users are created and enrolled as pending
            group members atomically with the group.
        staffEmails:
          type: array
          maxItems: 100
          items:
            type: string
            format: email
          description: Teaching staff assigned to this group (PRD 4.1).
        lecturerEmails:
          type: array
          maxItems: 100
          items:
            type: string
            format: email
          description: Lecturers assigned to this group (PRD 4.1).
        taEmails:
          type: array
          maxItems: 100
          items:
            type: string
            format: email
          description: Teaching assistants assigned to this group (PRD 4.1, optional).
    Page:
      type: object
      required: [limit, offset, total]
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    GroupsPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        page:
          $ref: "#/components/schemas/Page"
    NotificationPage:
      type: object
      required: [data, page, unreadCount]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        page:
          $ref: "#/components/schemas/Page"
        unreadCount:
          type: integer
          minimum: 0
          description: Total number of unread notifications, independent of pagination.
    Notification:
      type: object
      required: [id, kind, severity, title, createdAt]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
          description: optional group context
        kind:
          type: string
          enum: [launch_completed, launch_partially_failed, launch_failed,
                 invite_failure, classroom_failure, drive_failure,
                 forms_failure, onboarding_incomplete, audit_inconsistency,
                 announcement_delivered, announcement_failed]
        severity:
          type: string
          enum: [info, warning, error]
        title:
          type: string
        detail:
          type: string
        readAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    AnnouncementTemplate:
      type: object
      required: [id, name, body, kind, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        body:
          type: string
        kind:
          type: string
          enum: [welcome, staff_intro, rules, reminder, general]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AnnouncementTemplateInput:
      type: object
      required: [name, body]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
        kind:
          type: string
          enum: [welcome, staff_intro, rules, reminder, general]
          default: general
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    GoogleStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: connection lifecycle state
          enum: [connected, disconnected, error]
        accountEmail:
          type: string
          description: connected Google account (empty when disconnected)
        scopes:
          type: array
          items:
            type: string
          description: OAuth scopes granted by the connection
        connectedAt:
          type: string
          format: date-time
    SlackStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: connection lifecycle state
          enum: [connected, disconnected, error]
        teamId:
          type: string
          description: verified workspace team ID (empty when not connected)
        teamName:
          type: string
          description: workspace name — public metadata, safe to display
        connectedAt:
          type: string
          format: date-time
    SlackProvisionRequest:
      type: object
      properties:
        inviteEmails:
          type: array
          items:
            type: string
            format: email
          description: workspace members to invite to every group channel
        welcomeTemplate:
          type: string
          description: optional welcome-message override (default template otherwise)
    SlackProvisionResult:
      type: object
      required: [channels, invites, welcomeMessages]
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/SlackChannelResult"
        invites:
          type: array
          items:
            $ref: "#/components/schemas/SlackInviteResult"
        welcomeMessages:
          type: array
          items:
            $ref: "#/components/schemas/SlackWelcomeResult"
    SlackChannelResult:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        channelId:
          type: string
        status:
          type: string
          enum: [created, reused, failed]
        error:
          type: string
    SlackInviteResult:
      type: object
      required: [email, channelName, status]
      properties:
        email:
          type: string
        channelName:
          type: string
        status:
          type: string
          enum: [invited, already_member, failed]
        error:
          type: string
    SlackWelcomeResult:
      type: object
      required: [channelName, status]
      properties:
        channelName:
          type: string
        status:
          type: string
          enum: [posted, skipped, failed]
        error:
          type: string
    SlackEventAck:
      type: object
      properties:
        status:
          type: string
          description: processing outcome
          enum: [challenge, duplicate, processed, unresolved, bot, ignored]
        challenge:
          type: string
          description: echo of Slack's challenge (url_verification only)
    GroupOnboarding:
      type: object
      required: [group, summary, students]
      properties:
        group:
          $ref: "#/components/schemas/Group"
        summary:
          type: object
          required: [expectedCount, joinedCount, pendingCount, completionPercentage]
          properties:
            expectedCount:
              type: integer
            joinedCount:
              type: integer
            pendingCount:
              type: integer
            completionPercentage:
              type: number
              description: rounded to one decimal (e.g. 87.5)
        students:
          type: array
          items:
            $ref: "#/components/schemas/GroupOnboardingStudent"
    GroupOnboardingStudent:
      type: object
      required: [userId, fullName, email, onboardingStatus]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
        onboardingStatus:
          type: string
          enum: [pending, invited, joined_slack, form_submitted, complete]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: stable machine-readable code
              example: VALIDATION_ERROR
            message:
              type: string
              description: human-readable explanation
            fieldErrors:
              type: object
              additionalProperties:
                type: string
              description: per-field validation messages, when applicable
