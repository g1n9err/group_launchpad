version: "2"
sql:
  - engine: "postgresql"
    # golang-migrate layout: sqlc reads *.up.sql and ignores *.down.sql
    schema: "migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "gen"
        out: "internal/store/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "timestamptz"
            go_type: "time.Time"
